# Publishes Talkai's releases. This public repository builds them from the
# private source with its own pipeline (free for public repositories), so every
# release is created by github-actions[bot]. Every hour it looks for the newest
# version tag in the source; if that tag has no release here yet, it tests and
# builds it, publishes it, then installs it on all four platforms exactly as a
# customer would. A failed run is retried by the next hourly run.
#
# Secrets (GitHub masks them in logs):
#   SOURCE_REPO        owner/name of the private source repository
#   SOURCE_DEPLOY_KEY  a read-only deploy key of that repository
name: Release

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.find.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          path: src
          fetch-depth: 0
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(git -C src tag --list 'v*' --sort=-creatordate | head -n 1)
          if [ -z "$tag" ]; then echo "No version tags yet."; exit 0; fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag is already released."
            exit 0
          fi
          echo "Releasing $tag."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: find
    if: needs.find.outputs.tag != ''
    runs-on: macos-15 # builds the Linux and macOS CLIs and the universal Mac app
    env:
      TAG: ${{ needs.find.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          ref: ${{ needs.find.outputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Test
        run: |
          go vet ./...
          go test -count=1 ./...
      - name: Build downloads
        env:
          TALKAI_ISSUES_REPO: ${{ github.repository }} # `talkai bug` opens issues here
        run: scripts/build-release.sh "$TAG"
      - name: Check the downloads
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
        run: |
          cd dist
          shasum -a 256 -c SHA256SUMS
          test "$(ls talkai_*.tar.gz | wc -l | tr -d ' ')" = 4
          test -f Talkai_*_macOS.zip
          # Nothing published may name the private source or its owner.
          mkdir -p ../scan && for f in *.tar.gz; do tar -xzf "$f" -C ../scan; done && unzip -q Talkai_*_macOS.zip -d ../scan
          if grep -rl -e "$SOURCE_REPO" -e "${SOURCE_REPO%%/*}" ../scan; then
            echo "A download names the private source; not publishing."
            exit 1
          fi
      - name: Release notes
        run: |
          mkdir -p notes
          awk -v v="## $TAG" '$0 ~ "^## " {p = (index($0, v) == 1)} p && !(index($0, v) == 1)' CHANGELOG.md > notes/notes.md
          [ -s notes/notes.md ] || echo "Talkai $TAG" > notes/notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/
            notes/

  publish:
    needs: [find, build]
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.find.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          cat >> notes/notes.md <<EOF

          **Install** (macOS and Linux): \`curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.sh | sh\`
          Or download the file for your computer below and check it against \`SHA256SUMS\`. Guide: [talkailabs.com/docs](https://talkailabs.com/docs/#install).
          EOF
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "Talkai $TAG" --notes-file notes/notes.md $prerelease

  smoke:
    needs: [find, publish]
    name: install (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64, os: ubuntu-24.04 }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: macos-intel, os: macos-15-intel }
          - { name: macos-arm64, os: macos-15 }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install exactly as a customer would
        env:
          TALKAI_VERSION: ${{ needs.find.outputs.tag }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.sh" | sh
          ~/.local/bin/talkai version | grep -q "$TALKAI_VERSION"
      - name: Use it
        env:
          TALKAI_HISTORY: "off"
          TALKAI_SESSIONS: "off"
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          talkai --explain "list pods in kube-system" | grep -q "kubectl get pods -n kube-system"
          talkai --dry-run "what's everyone doing?"
          talkai doctor || true # reports missing tools on a bare runner; must not crash
